config_surfaces:
  training:
    - id: unified_training_shadow_stage2_rollout_correction
      status: active
      surface_id: stage2_rollout_correction
      resolver: src/training/surfaces.py::TrainingSurfaceResolver
      pipeline: src/trainers/stage2_rollout_correction.py::Stage2RolloutCorrectionTrainer
      domains:
        - run
        - surface
        - data
        - template
        - supervision
        - objectives
        - observability
        - artifacts
        - runtime
      assignment_strategy: greedy_iou
      duplicate_filter_order: before_assignment_and_target_realization
      residual_set_correction: true
      notes: "Active Stage-2 rollout-correction direction. Duplicate filtering runs before greedy-IoU assignment; unmatched GT becomes residual GT-correction events. Greedy IoU is the only live Stage-2 assignment strategy."
    - id: stage1_detection_teacher_forcing
      status: canonical
      config: configs/stage1/detection_teacher_forcing/prod/compact_support2.yaml
      smoke_config: configs/stage1/detection_teacher_forcing/smoke/compact_tiny.yaml
      parser: src/config/schema.py::DetectionTrainingConfig
      runtime: src/detection/runtime.py
      notes: "Canonical clean-break Stage-1 detection teacher-forcing public route. New compact teacher-forcing configs should live under configs/stage1/detection_teacher_forcing/."
    - id: stage1_retired_recursive_detection_archive
      status: historical-archive
      archive_root: configs/archive/detection_scene_clean_break/stage1/
      notes: "Retired recursive-detection and compact-bridge config roots are quarantined for historical inspection only. Use stage1_detection_teacher_forcing for current Stage-1 configs."

