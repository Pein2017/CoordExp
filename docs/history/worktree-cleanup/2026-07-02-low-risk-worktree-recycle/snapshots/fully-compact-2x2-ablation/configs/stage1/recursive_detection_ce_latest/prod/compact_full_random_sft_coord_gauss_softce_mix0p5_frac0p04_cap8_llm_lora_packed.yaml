# Fully-compact full-object random-order SFT plus Gaussian coord soft CE.
extends:
  - ./compact_full_llm_lora_packed_base.yaml

training:
  artifact_subdir: compact_full_fullobj_random_sft_coord_gauss_softce_mix0p5_frac0p04_cap8_llm_lora_packed_r16_a32_bsz16_4epoch_tokenrows_v2
  run_name: compact-full-fullobj-random-sft-coord-gauss-softce-mix0p5-frac0p04-cap8-llm-lora-packed-r16-a32-bsz16-4epoch-tokenrows-v2

data:
  object_ordering: random_permutation

objective:
  id: sft
  variant: random_order_sft
  state_weighting: none
  normalization: token_mean
  coord_soft_ce:
    enabled: true
    target_distribution: gaussian_around_gold
    gaussian_mixture_weight: 0.5
    gaussian_r95_axis_fraction: 0.04
    gaussian_r95_cap_bins: 8
