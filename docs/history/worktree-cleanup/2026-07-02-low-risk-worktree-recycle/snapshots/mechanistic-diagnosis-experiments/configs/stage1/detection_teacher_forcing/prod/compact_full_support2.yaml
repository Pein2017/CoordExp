# Canonical clean-break Stage-1 detection teacher-forcing config.
#
# This replaces the public recursive_detection_ce vocabulary for the retained
# compact_full Stage-1 teacher-forcing surface while keeping the same data,
# prompt, template, token-row, no-resize, and no-packing runtime invariants.
model:
  model: model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  model_type: qwen3_vl
  attn_impl: flash_attention_2
  torch_dtype: bfloat16

template:
  template: qwen3_vl
  truncation_strategy: raise
  max_length: 12000
  max_pixels: 1048576

training:
  output_root: /data/CoordExp/outputs/stage1_2b/detection_teacher_forcing
  logging_root: /data/CoordExp/outputs/stage1_2b/detection_teacher_forcing/tb
  artifact_subdir: compact_full_valid_set_teacher_forcing_bsz16_4epoch_tokenrows_v2
  run_name: compact-full-valid-set-teacher-forcing-bsz16-4epoch-tokenrows-v2
  num_train_epochs: 4
  per_device_train_batch_size: 16
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  learning_rate: 5.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.1
  lr_scheduler_type: cosine
  optimizer: multimodal_coord_offset
  optim: adamw_torch_fused
  train_type: lora
  freeze_vit: true
  freeze_aligner: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  remove_unused_columns: false
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  packing: false
  eval_packing: false
  encoded_sample_cache:
    enabled: false
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  save_delay_steps: 600
  logging_steps: 10
  logging_first_step: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false

deepspeed:
  enabled: false

data:
  train_jsonl: public_data/coco/rescale_32_1024_bbox_max60/train.coord.jsonl
  val_jsonl: public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  image_root: public_data/coco/rescale_32_1024_bbox_max60
  object_ordering: random_permutation

prompt:
  system_variant: stage1_detection
  user_variant: compact_detection
  include_template_summary: true
  prompt_variant_enabled: true

detection_template:
  id: compact_full
  coordinate_surface: coord_token
  bbox_format: xyxy
  strict_parse: true

token_rows:
  enabled: true
  tie_head: true
  groups:
    coord_geometry:
      role: coord_geometry
      start_token: "<|coord_0|>"
      end_token: "<|coord_999|>"
      expected_start: 151670
      expected_end: 152669
    compact_structure:
      role: structural_ce_only
      tokens: ["<|object_ref_start|>", "<|box_start|>"]
      expected_ids:
        "<|object_ref_start|>": 151646
        "<|box_start|>": 151648
  embed_lr: 5.0e-5
  weight_decay: 0.0

objective:
  id: teacher_forcing
  profile: pure_valid_set_marginal
  target_ir:
    rollin_policy:
      name: random_permutation
      base_seed: 17
    exact_packing_mapping:
      enabled: false
  modules:
    token_type_mass:
      enabled: false
    conditional_valid_set_likelihood:
      enabled: false
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: false

packing:
  static_packing: false
  padding_free_packed: false

evaluation:
  expected_template: compact_full
  parser_mode: strict_expected

validation:
  validate_span_alignment: true
  validate_template_capabilities: true
  fail_fast: true
