schema_version: 1
run:
  name: instance_margin-order17-step64
  artifact_root: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/infer
  collision_policy: fail
model:
  base_model: /data/Qwen3-VL/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  dtype: bf16
  processor:
    do_resize: false
data:
  input_jsonl: /data/CoordExp/outputs/infra_base/untied-axis-val200-20260918/val200.coord.jsonl
template:
  assistant_format: object_box_closed
  object_field_order: desc_first
  object_ordering: geo_sorted_xy
  prompt:
    system: 'You are a general-purpose object detection and grounding assistant. Output
      one compact detection row per object by concatenating rows directly with no
      separator, no newline, and no extra text. Use this row pattern exactly: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Descriptions are raw class text; bbox coords are four coord tokens in x1 y1
      x2 y2 order.'
    user: 'Locate each clearly visible object instance in the image. Return compact
      rows using this exact pattern: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Use one row per object; concatenate rows directly with no separator and do not
      insert newline characters. Restrict `desc` to this COCO-80 class list: person,
      bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
      fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep,
      cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
      frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard,
      surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl,
      banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake,
      chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote,
      keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock,
      vase, scissors, teddy bear, hair drier, toothbrush.'
backend:
  type: hf
  hf:
    attn_implementation: flash_attention_2
    patch_embed_linearization: enabled
    coordinate_output_norm: median
generation:
  batch_size: 4
  max_new_tokens: 3084
  temperature: 0.0
  top_p: 1.0
  n: 1
  repetition_penalty: 1.0
scoring:
  enabled: true
artifacts:
  write_token_trace: true
  write_parse_diagnostics: true
  include_raw_model_logprob: false
debug:
  smoke: false
  dry_run: false
adapter:
  type: dora
  path: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/train/instance_margin-order17/checkpoints/step-64/adapter
  name: default
embedding_delta:
  path: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/train/instance_margin-order17/checkpoints/step-64/special_token_embeddings
