adapter:
  alpha: 32
  bias: none
  dropout: 0.0
  path: null
  rank: 16
  repaired_embedding_payload_path: /data/CoordExp/outputs/infra_base/train/qwen3-vl-2b-geo-sorted-xy-untied-illegal-mass001-ebs24-4epoch/checkpoints/step-2444/special_token_embeddings
  seed_mode: warm_start_expand_dora
  source_adapter_path: /data/CoordExp/outputs/infra_base/train/qwen3-vl-2b-geo-sorted-xy-untied-illegal-mass001-ebs24-4epoch/checkpoints/step-2444/adapter
  target_modules: all_linear
  target_towers:
  - language
  type: dora
checkpoint:
  steps:
  - 64
  - 256
  save_final: true
data:
  augmentation:
    train:
      geometry_flips:
        enabled: false
        horizontal_prob: 0.0
        vertical_prob: 0.0
  eval:
    path: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/data/smoke_eval.jsonl
    sample_limit: null
  train:
    path: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/data/train8192-order17.jsonl
    sample_limit: null
  train_order: source_order
eval:
  forward:
    steps: []
  inference:
    enabled: false
losses:
  auxiliary:
    conditional_order_gate:
      weight: 0.01
    coord_gaussian_rps: null
  normalizer: segment_balanced
  protected:
    base_ce:
      weight: 1.0
    token_type_gate:
      groups:
      - desc_text
      - schema
      - coordinate
      - eos
      mode: enabled
      weight: 0.1
model:
  attn_implementation: flash_attention_2
  base_model: /data/Qwen3-VL/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  fa2_branch_proof: first_micro_step
  logits_memory_budget_bytes: 4000000000
  processor:
    do_resize: false
    max_merged_visual_tokens: 4096
    max_raw_pixels: 1048576
  runtime_patches:
    patch_embed_linearization: enabled
  special_token_embeddings:
    groups:
      coordinate_tokens: default_coord_0_999
      wrapper_tokens: default_object_box_wrappers
    tie_word_embeddings: false
observability:
  steps: 1
optimizer:
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  groups:
    adapters:
      aligner: null
      language:
        lr: 2.0e-05
        weight_decay: 0.0
      vision: null
    token_embeddings:
      lr: 1.0e-05
      weight_decay: 0.0
  kwargs: {}
  name: adamw_torch
  scheduler:
    kwargs: {}
    name: cosine_with_warmup
    warmup_ratio: 0.1
    warmup_steps: null
packing:
  cursor_byte_budget: 65536
  fragment_byte_budget: 4194304
  fragment_item_budget: 1024
  global_max_length: 12000
  lookahead: null
  max_packs_per_fragment: null
  policy: source_order_next_fit
  seed: 17
  window_size: null
  worker_count: 1
resume:
  mode: disabled
  checkpoint_dir: null
run:
  name: control-order17
  artifact_root: /data/CoordExp/outputs/infra_base/start-loss-benchmark-20260928/train
  collision_policy: fail
runtime:
  determinism:
    mode: strict_cuda_replay_v1
  seed: 17
schema_version: 1
template:
  assistant_format: object_box_closed
  object_field_order: desc_first
  object_ordering: geo_sorted_xy
  prompt:
    system: 'You are a general-purpose object detection and grounding assistant. Output
      one compact detection row per object by concatenating rows directly with no
      separator, no newline, and no extra text. Use this row pattern exactly: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Descriptions are raw class text; bbox coords are four coord tokens in x1 y1
      x2 y2 order.'
    user: 'Locate each clearly visible object instance in the image. Return compact
      rows using this exact pattern: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Use one row per object; concatenate rows directly with no separator and do not
      insert newline characters. Restrict `desc` to this COCO-80 class list: person,
      bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light,
      fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep,
      cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
      frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard,
      surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl,
      banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake,
      chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote,
      keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock,
      vase, scissors, teddy bear, hair drier, toothbrush.'
training:
  effective_batch_size: 24
  epochs: 8
  forward_input_provider_mode: synchronous
  max_grad_norm: 1.0
  max_steps: 256
  mode: supervised
  precision: bf16
