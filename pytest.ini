[pytest]
addopts = --import-mode=importlib
markers =
    live_environment: checks the installed application or mutable external dataset against a frozen receipt; select explicitly for environment qualification
testpaths =
    tests/adapters
    tests/artifacts
    tests/augmentation
    tests/coco_refinement
    tests/label_studio_coco_refinement
    tests/common
    tests/config
    tests/data
    tests/eval
    tests/inference
    tests/losses
    tests/optim
    tests/packing
    tests/qwen
    tests/runtime
    tests/supervision
    tests/templates
    tests/training
    tests/test_gt_vs_pred_visualization.py
