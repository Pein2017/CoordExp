extends: wave7_real_base_batched_smoke.yaml
run:
  name: wave7-real-production-adapter-smoke
template:
  object_field_order: desc_first
  object_ordering: geo_sorted
  assistant_format: object_box_closed
  prompt:
    system: >-
      You are a general-purpose object detection and grounding assistant. Output one compact detection row per object by concatenating rows directly with no separator, no newline, and no extra text. Use this row pattern exactly: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>. Descriptions are raw class text; bbox coords are four coord tokens in x1 y1 x2 y2 order.
    user: >-
      Locate each clearly visible object instance in the image. Return compact rows using this exact pattern: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>. Use one row per object; concatenate rows directly with no separator and do not insert newline characters. Restrict `desc` to this COCO-80 class list: person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear, hair drier, toothbrush.
generation:
  batch_size: 2
  max_new_tokens: 256
adapter:
  type: dora
  path: ../../../outputs/prod/coordexp_swift/qwen3_vl_2b_desc_first_geo_sorted_pure_ce_dora_llm_12000_accelerate8_ebs128_4epoch-prod8-ebs128-4epoch-cocoprompt-20260702T052657Z/checkpoints/step-459/adapter
  name: default
embedding_delta:
  path: ../../../outputs/coordexp_swift/infer/wave7_real_smokes/repaired_special_token_embeddings_step459
