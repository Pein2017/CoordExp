schema_version: 1

run:
  name: qwen3_vl_2b_desc_first_geo_sorted_rollout_calibration_coordinate_smoke_a_v1
  artifact_root: /data/CoordExp/outputs/research/qwen3-vl-dense-enumeration/2026-07-20-own-prefix-entity-transition-and-coordinate-boundary-calibration-training-screen/smoke-a-combined-v3/runs
  collision_policy: fail

model:
  base_model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  attn_implementation: flash_attention_2
  fa2_branch_proof: first_micro_step
  logits_memory_budget_bytes: 4000000000
  processor:
    do_resize: false
    max_raw_pixels: 1048576
    max_merged_visual_tokens: 4096
  special_token_embeddings:
    groups:
      coordinate_tokens: default_coord_0_999
      wrapper_tokens: default_object_box_wrappers

adapter:
  type: dora
  target_towers: [language]
  target_modules: all_linear
  rank: 16
  alpha: 32
  dropout: 0.0
  bias: none
  seed_mode: warm_start_expand_dora
  source_adapter_path: /data/CoordExp/.worktrees/CoordExp-swift/outputs/prod/coordexp_swift/qwen3_vl_2b_desc_first_geo_sorted_pure_ce_typegate_dora_r16a32_llm_12000_accelerate8_ebs24_8epoch_warmup0p1/checkpoints/step-4887/adapter
  repaired_embedding_payload_path: /data/CoordExp/.worktrees/CoordExp-swift/outputs/prod/coordexp_swift/qwen3_vl_2b_desc_first_geo_sorted_pure_ce_typegate_dora_r16a32_llm_12000_accelerate8_ebs24_8epoch_warmup0p1/checkpoints/step-4887/special_token_embeddings

data:
  train: null
  eval: null
  train_order: source_order
  augmentation:
    train:
      geometry_flips:
        enabled: false
        horizontal_prob: 0.0
        vertical_prob: 0.0

template:
  object_field_order: desc_first
  object_ordering: geo_sorted
  assistant_format: object_box_closed
  prompt:
    system: >-
      You are a general-purpose object detection and grounding assistant. Output one compact detection row per object by concatenating rows directly with no separator, no newline, and no extra text. Use this row pattern exactly: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>. Descriptions are raw class text; bbox coords are four coord tokens in x1 y1 x2 y2 order.
    user: >-
      Locate each clearly visible object instance in the image. Return compact rows using this exact pattern: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>. Use one row per object; concatenate rows directly with no separator and do not insert newline characters. Restrict `desc` to this COCO-80 class list: person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch, potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear, hair drier, toothbrush.

packing:
  global_max_length: 12000

losses:
  normalizer: event_balanced
  protected:
    base_ce:
      weight: 0.0
    token_type_gate:
      weight: 0.0
      groups: [desc_text, schema, coordinate, eos]
    coord_gaussian_rps:
      weight: 0.0
      gaussian_weight: 0.0
      rps_weight: 0.0
    rollout_site_token_type_gate:
      weight: 0.1

rollout_calibration:
  profile: coordinate_boundary_only
  state_bank_manifest_path: /data/CoordExp/outputs/research/qwen3-vl-dense-enumeration/2026-07-20-own-prefix-entity-transition-and-coordinate-boundary-calibration-training-screen/smoke-a-combined-v4/state-bank/manifest.json
  source_checkpoint_id: ec308f8f5a26f5425eadeecf6fde5114d10dbf8e31de0b1fa0cc78abab8c3f2c
  entity_transition:
    weight: 0.0
    margin: 1.0
    smooth_max_temperature: 0.5
  coordinate_boundary:
    weight: 1.0
    margin: 1.0
  incomplete_objective_policy: fail
  online_state_bank_refresh: false

optimizer:
  name: adamw_torch
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  kwargs: {}
  groups:
    adapters:
      language:
        lr: 5.0e-5
        weight_decay: 0.0
      vision: null
      aligner: null
    token_embeddings:
      lr: 1.0e-4
      weight_decay: 0.0
  scheduler:
    name: cosine_with_warmup
    warmup_ratio: null
    warmup_steps: 0
    kwargs: {}

training:
  mode: rollout_calibration
  epochs: 1
  max_steps: 1
  effective_batch_size: 1
  precision: bf16
  max_grad_norm: 1.0

runtime:
  seed: 19

eval:
  forward:
    every_fraction: null
    steps: []
  inference:
    enabled: false

checkpoint:
  every_fraction: null
  steps: []
  save_final: true
