# CoordExp-Swift production benchmark inference.
#
# Scope:
# - dataset: COCO rescale_32_1024_bbox_len12000 val.coord.jsonl
# - slice: first 200 records (`val200`, via infer.limit)
# - checkpoint: CoordExp-Swift r16/a32 EBS64 warmup0p1 final checkpoint metadata, step-917
# - template surface: compact_object_box_closed coord-token detection rows
# - prompt/order: desc_first + geo_sorted + COCO-80 class prior
# - launch shape: 8 GPUs via scripts/run_infer.py --gpus 8
# - decoding: temperature=0.0, repetition_penalty=1.10

run:
  name: qwen3_vl_2b_desc_first_geo_sorted_dora_r16a32_ebs64_step917_val200_bsz4_temp0_rp1p10_max3084_8gpu
  output_dir: /data/CoordExp/outputs/infer/coordexp_swift

stages:
  infer: true
  eval: true
  vis: false

detection_template:
  id: compact_object_box_closed

infer:
  gt_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000/val.coord.jsonl
  model_checkpoint: /data/CoordExp/.worktrees/CoordExp-swift/outputs/prod/coordexp_swift/qwen3_vl_2b_desc_first_geo_sorted_pure_ce_dora_r16a32_llm_12000_accelerate8_ebs64_4epoch_warmup0p1-prod8-r16a32-ebs64-warmup0p1-20260702T170007Z/checkpoints/step-917/checkpoint.json

  prompt_variant: coco_80
  bbox_format: xyxy
  object_field_order: desc_first
  object_ordering: geo_sorted

  mode: coord
  pred_coord_mode: auto

  backend:
    type: hf
    attn_implementation: flash_attention_2

  generation:
    temperature: 0.0
    top_p: 0.9
    max_new_tokens: 3084
    repetition_penalty: 1.10
    batch_size: 4
    seed: 42

  device: cuda:0
  limit: 200
  detect_samples: 128

confidence:
  fusion_w_geom: 1.0
  fusion_w_desc: 0.0
  desc_span_policy: best_effort
  empty_desc_policy: geom_only

eval:
  metrics: both
  strict_parse: false
  use_segm: false
  lvis_max_dets: 300

  overlay: false
  overlay_k: 12
  num_workers: 8

  semantic_model: /data/CoordExp/model_cache/all-MiniLM-L6-v2-local
  semantic_threshold: 0.5
  semantic_device: cuda:0
  semantic_batch_size: 64

  f1ish_iou_thrs: [0.3, 0.5]
  f1ish_pred_scope: annotated

  duplicate_control:
    enabled: true
