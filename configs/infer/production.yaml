# Deterministic base-model inference template. Adapter and embedding-delta
# paths are deliberately absent: a completed run supplies them explicitly.
schema_version: 1

run:
  name: qwen3-vl-2b-coco-infer
  artifact_root: /data/CoordExp/outputs/infra_base/infer
  collision_policy: timestamp

model:
  base_model: ../../model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  dtype: bf16
  processor:
    do_resize: false

data:
  input_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000/val.coord.jsonl

template:
  object_field_order: desc_first
  object_ordering: geo_sorted
  assistant_format: object_box_closed
  prompt:
    system: >-
      You are a general-purpose object detection and grounding assistant.
    user: >-
      Locate each clearly visible object instance in the image. Use the
      CoordExp object-box format and COCO class text.

backend:
  type: hf
  hf:
    attn_implementation: flash_attention_2
    patch_embed_linearization: enabled

generation:
  batch_size: 2
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  n: 1
  repetition_penalty: 1.0

scoring:
  enabled: true

artifacts:
  write_token_trace: true
  write_parse_diagnostics: true
  include_raw_model_logprob: false

debug:
  smoke: false
  dry_run: false
