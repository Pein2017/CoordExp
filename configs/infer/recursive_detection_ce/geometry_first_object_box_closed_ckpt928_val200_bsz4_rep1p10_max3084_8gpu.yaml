# Geometry-first compact object/box-closed Stage-1 checkpoint-928 val200 infer/eval.
#
# Scope:
# - dataset: COCO rescale_32_1024_bbox_max60 val.coord.jsonl
# - slice: first 200 records (`val200`, via infer.limit)
# - checkpoint: adapter shorthand checkpoint-928 from the 4-epoch geometry-first run
# - template surface: compact_object_box_closed coord-token detection rows
# - object ordering: sorted, matching training
# - launch shape: 8 GPUs via scripts/run_infer.py --gpus 8
# - decoding: temperature=0.0, repetition_penalty=1.10

run:
  name: geometry_first_object_box_closed_ckpt928_val200_bsz4_temp0_rep1p10_max3084_8gpu
  output_dir: /data/CoordExp/outputs/infer/recursive_detection_ce

stages:
  infer: true
  eval: true
  vis: false

detection_template:
  id: compact_object_box_closed

infer:
  gt_jsonl: public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  model_checkpoint: /data/CoordExp/output/stage1_2b/coco_bbox_max60_1024-coco80-geometry_first-compact_object_box_closed-sorted-packed12k-natural_adjacent-pure_ce/epoch_4-pure_ce-coco80-geometry_first-1024-compact_object_box_closed-sorted-packed12k-natural_adjacent-llm_only/v5-20260617-141636/checkpoint-928

  prompt_variant: coco_80
  bbox_format: xyxy
  object_field_order: geometry_first
  object_ordering: sorted

  mode: coord
  pred_coord_mode: auto

  backend:
    type: hf
    attn_implementation: flash_attention_2

  generation:
    temperature: 0.0
    top_p: 0.9
    max_new_tokens: 3084
    repetition_penalty: 1.10
    batch_size: 4
    seed: 42

  device: cuda:0
  limit: 200
  detect_samples: 128

confidence:
  fusion_w_geom: 1.0
  fusion_w_desc: 0.0
  desc_span_policy: best_effort
  empty_desc_policy: geom_only

eval:
  metrics: both
  strict_parse: false
  use_segm: false
  lvis_max_dets: 300

  overlay: false
  overlay_k: 12
  num_workers: 8

  semantic_model: model_cache/all-MiniLM-L6-v2-local
  semantic_threshold: 0.5
  semantic_device: cuda:0
  semantic_batch_size: 64

  f1ish_iou_thrs: [0.3, 0.5]
  f1ish_pred_scope: annotated

  duplicate_control:
    enabled: true
