# Compact-full adapter checkpoint-3664 HF infer/eval smoke.
#
# Scope:
# - dataset: COCO rescale_32_1024_bbox_max60 val.coord.jsonl
# - slice: first 2 records (`smoke2`, via infer.limit)
# - checkpoint: adapter shorthand checkpoint-3664 from the tokenrows_v2 support-2 run
# - template surface: compact_full coord-token detection rows
# - generation contract: Qwen chat EOS `<|im_end|>` and pad `<|endoftext|>`

run:
  name: smoke_compact_full_support2_tokenrows_v2_ckpt3664_hf_limit2
  output_dir: temp/infer/recursive_detection_ce

stages:
  infer: true
  eval: true
  vis: false

detection_template:
  id: compact

infer:
  gt_jsonl: public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  model_checkpoint: outputs/stage1_2b/recursive_detection_ce/compact_full_et_rmp_ce_support2_bsz16_4epoch_tokenrows_v2/compact-full-et-rmp-ce-support2-bsz16-4epoch-tokenrows-v2/v0-20260504-071356/checkpoint-3664

  prompt_variant: coco_80
  bbox_format: xyxy
  object_field_order: desc_first
  object_ordering: random

  mode: coord
  pred_coord_mode: auto

  backend:
    type: hf
    attn_implementation: flash_attention_2

  generation:
    temperature: 0.0
    top_p: 0.9
    max_new_tokens: 3084
    repetition_penalty: 1.10
    batch_size: 1
    seed: 42

  device: cuda:0
  limit: 2
  detect_samples: 2

confidence:
  fusion_w_geom: 1.0
  fusion_w_desc: 0.0
  desc_span_policy: best_effort
  empty_desc_policy: geom_only

eval:
  metrics: both
  strict_parse: false
  use_segm: false
  lvis_max_dets: 300

  overlay: false
  overlay_k: 12
  num_workers: 0

  semantic_model: model_cache/all-MiniLM-L6-v2-local
  semantic_threshold: 0.5
  semantic_device: cuda:0
  semantic_batch_size: 8

  f1ish_iou_thrs: [0.3, 0.5]
  f1ish_pred_scope: annotated

  duplicate_control:
    enabled: true
