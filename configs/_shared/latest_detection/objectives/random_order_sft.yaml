# Coord-token latest compact SFT ablation only. This overlay excludes raw-text
# norm1000 profiles and legacy custom.bbox_geo geometry-loss ablations.
objective:
  id: sft
  variant: random_order_sft
  trie_support_weight: 0.0
  trie_balance_weight: 0.0
  state_weighting: none
  normalization: token_mean
