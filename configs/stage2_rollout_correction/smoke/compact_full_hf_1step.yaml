extends: ../base.yaml

experiment:
  title: Stage-2 rollout-correction compact-full ckpt3664 COCO-80 HF one-step smoke
  purpose: >
    Exercise the unified residual rollout prefix plus GT correction trainer with
    the smallest practical HF rollout smoke.
  hypothesis: >
    Config loading, live rollout preparation, residual target IR construction,
    and artifact wiring remain coherent without the removed clean-prefix branch.
  key_deviations:
    - One optimizer step.
    - HF rollout backend.
    - Canonical residual_set_correction objective only.
  runtime_settings:
    - "custom.trainer_variant: stage2_rollout_correction"
    - "custom.detection_sequence_format: compact_full"
    - "rollout_matching.prompt_variant/eval_prompt_variant: coco_80"

model:
  model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  adapters:
    - /data/CoordExp/temp/baidudisk-union-sync/download-staging/outputs/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest/compact_full_et_rmp_ce_support2_bsz16_4epoch_tokenrows_v2/compact-full-et-rmp-ce-support2-bsz16-4epoch-tokenrows-v2/v0-20260504-071356/checkpoint-3664

training:
  output_dir: output/stage2_rollout_correction/smoke/compact_full_hf_1step
  logging_dir: output/stage2_rollout_correction/logs
  run_name: compact_full_hf_1step
  max_steps: 1
  eval_strategy: "no"
  save_strategy: "no"
  per_device_train_batch_size: 1
  effective_batch_size: 8
  logging_steps: 1

custom:
  train_jsonl: public_data/coco/rescale_32_1024_bbox_max60/train.coord.jsonl
  val_jsonl: public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  detection_sequence_format: compact_full
  object_field_order: desc_first
  train_sample_limit: 8
  val_sample_limit: 0

stage2_rollout_correction:
  pipeline:
    objective:
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        application:
          preset: rollout_self_prefix
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
    diagnostics: []
  correction:
    rollout_template_family: compact_full
    rollout_decode_policy: unconstrained
    invalid_rollout_policy: fallback_gt_fn_append_only
    insertion_order: tail_append
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.3, 0.5, 0.7]

rollout_matching:
  rollout_backend: hf
  eval_rollout_backend: hf
  rollout_decode_batch_size: 4
  eval_decode_batch_size: 4
  prompt_variant: coco_80
  eval_prompt_variant: coco_80
  decode_mode: sampling
  decoding:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
