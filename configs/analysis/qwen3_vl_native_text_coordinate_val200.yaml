schema_version: 1
run:
  name: qwen3-vl-native-text-coordinate-val200
  artifact_root: /data/CoordExp/outputs/research/qwen3-vl-native-text-coordinate-val200
model:
  base_model: /data/Qwen3-VL/model_cache/models/Qwen/Qwen3-VL-2B-Instruct
  dtype: bf16
  attn_implementation: sdpa
  patch_embed_linearization: disabled
data:
  input_jsonl: /data/CoordExp/.worktrees/CoordExp-swift/outputs/coordexp_swift/infer/val200_inputs/coco_val200_len12000.rebased_images.coord.jsonl
  image_resize: false
generation:
  batch_size: 4
  max_new_tokens: 2048
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0
  seed: 42
prompt:
  template: pretrained_processor_chat
  user: >-
    Identify every clearly visible object instance in the image whose class is
    in this COCO-80 list: {coco80_classes}. Return only a JSON array in Qwen3-VL's
    native grounding format. Each element must have exactly
    {"bbox_2d": [x1, y1, x2, y2], "label": "class"}. Use the exact class names
    from the list and integer coordinates normalized to the model's native
    0-1000 scale. Include all visible instances. Do not include explanations or
    Markdown.
ontology:
  name: coco-80
  classes:
    - person
    - bicycle
    - car
