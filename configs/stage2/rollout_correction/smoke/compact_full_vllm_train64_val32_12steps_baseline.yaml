extends: ../base.yaml

experiment:
  surface: smoke
  claim_scope: smoke
  title: Stage-2 rollout-correction compact-full vLLM 12-step baseline
  purpose: >
    Short non-production baseline for duplication-burst research on the active
    rollout-correction trainer.
  hypothesis: >
    The unmodified residual-set target construction will reproduce enough local
    same-class duplicate bursts to compare against a rollback candidate.
  key_deviations:
    - Limits training to 64 samples and validation to 32 samples.
    - Runs 12 optimizer steps with eval/materialized rollout artifacts.
    - Uses compact-full rollouts with four temperatures.
  runtime_settings:
    - "pipeline.id: stage2_rollout_correction"
    - "detection_template.id: compact_full"
    - "rollout_matching.rollout_backend: vllm"

model:
  model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  adapters:
    - /data/CoordExp/temp/baidudisk-union-sync/download-staging/outputs/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest/compact_full_et_rmp_ce_support2_bsz16_4epoch_tokenrows_v2/compact-full-et-rmp-ce-support2-bsz16-4epoch-tokenrows-v2/v0-20260504-071356/checkpoint-3664

tuner:
  use_dora: false
  target_modules: null
  target_regex: ^(model.language_model.*\.(up_proj|q_proj|down_proj|v_proj|k_proj|gate_proj|o_proj))$
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.05

training:
  output_dir: output/stage2_rollout_correction/smoke/compact_full_vllm_train64_val32_12steps_baseline
  logging_dir: output/stage2_rollout_correction/logs
  run_name: compact_full_vllm_train64_val32_12steps_baseline
  max_steps: 12
  eval_strategy: steps
  eval_steps: 6
  save_strategy: "no"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  effective_batch_size: 8
  logging_steps: 1

prompt:
  user_variant: compact_detection

detection_template:
  id: compact_full

token_embeddings_adapter:
  enabled: true
  tie_head: true
  groups:
    coord_geometry:
      role: coord_geometry
      start_token: "<|coord_0|>"
      end_token: "<|coord_999|>"
      expected_start: 151670
      expected_end: 152669
    compact_structure:
      role: structural_ce_only
      tokens:
        - "<|object_ref_start|>"
        - "<|box_start|>"
      expected_ids:
        "<|object_ref_start|>": 151646
        "<|box_start|>": 151648
  embed_lr: 5.0e-5
  head_lr: 5.0e-5
  weight_decay: 0.0

evaluation:
  expected_template: compact_full
  parser_mode: strict_expected

debug:
  enabled: true
  train_sample_limit: 64
  val_sample_limit: 32

stage2_rollout_correction:
  pipeline:
    objective:
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        application:
          preset: rollout_self_prefix
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          duplicate_burst_prefix_rollback: false
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
    diagnostics: []
  correction:
    assignment:
      strategy: greedy_iou
      iou_threshold: null
    rollout_template_family: compact_full
    invalid_rollout_policy: fallback_gt_fn_append_only
    insertion_order: tail_append
    duplicate_control:
      iou_threshold: 0.90
      center_radius_scale: 0.8
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.3, 0.5, 0.7]

rollout_matching:
  rollout_backend: vllm
  eval_rollout_backend: vllm
  rollout_decode_batch_size: 4
  eval_decode_batch_size: 4
  decode_mode: sampling
  max_new_tokens: 3084
  decoding:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  train_monitor_dump:
    enabled: true
    every_rollout_steps: 3
    dump_first_step: true
    max_samples: 8
    max_events: 64
    max_text_chars: 6000
  eval_detection:
    enabled: true
    materialize_artifacts: true
    metrics: coco
    strict_parse: true
  vllm:
    mode: server
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_model_len: 20000
    enable_lora: true
    max_lora_rank: 16
    enable_tower_connector_lora: true
    sync:
      mode: adapter
    enable_prefix_caching: true
    enforce_eager: true
    disable_custom_all_reduce: true
    mm_processor_kwargs:
      do_resize: false
    server:
      timeout_s: 240.0
      infer_timeout_s: 240.0
      servers:
        - base_url: http://127.0.0.1:8000
          group_port: 51216
