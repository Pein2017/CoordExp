extends: compact_full_vllm_train64_val32_6steps_coco80_evaltrace.yaml

experiment:
  title: Stage-2 rollout-correction compact-full COCO-80 duplicate-prefix rollback
  purpose: >
    Compare the duplicate-prefix rollback target-construction knob against the
    same compact-full ckpt3664 + COCO-80 6-step evaltrace pilot surface.
  hypothesis: >
    If duplication burst is mainly a local repeated-object continuation error,
    rolling the residual-set prefix back to the last stable object boundary
    should reduce duplicate continuation pressure without increasing invalid
    or malformed rollouts.
  key_deviations:
    - Inherits the COCO-80 prompt, vLLM server, train64/val32, 6-step evaltrace
      pilot surface.
    - Enables residual_set_correction.config.duplicate_burst_prefix_rollback.

training:
  output_dir: output/stage2_rollout_correction/smoke/compact_full_vllm_train64_val32_6steps_coco80_dup_prefix_rollback
  run_name: compact_full_vllm_train64_val32_6steps_coco80_dup_prefix_rollback

stage2_rollout_correction:
  pipeline:
    objective:
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        application:
          preset: rollout_self_prefix
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          duplicate_burst_prefix_rollback: true
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
    diagnostics: []
