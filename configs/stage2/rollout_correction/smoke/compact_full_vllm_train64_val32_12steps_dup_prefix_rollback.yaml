extends: compact_full_vllm_train64_val32_12steps_baseline.yaml

experiment:
  title: Stage-2 rollout-correction compact-full vLLM duplicate-prefix rollback
  purpose: >
    Test whether truncating residual-set clean prefixes at local same-class
    duplicate bursts reduces repeated-object continuation without damaging
    train/eval recall.
  hypothesis: >
    If duplication burst is mainly a local continuation error, shifting the
    correction target to the first repeated boundary should reduce duplicate
    rows while preserving plausible unmatched-object neutrality.
  key_deviations:
    - Enables residual_set_correction.config.duplicate_burst_prefix_rollback.
    - Keeps decode, data slice, duplicate-control thresholds, and ordering
      matched to the baseline config.

training:
  output_dir: output/stage2_rollout_correction/smoke/compact_full_vllm_train64_val32_12steps_dup_prefix_rollback
  run_name: compact_full_vllm_train64_val32_12steps_dup_prefix_rollback
  max_steps: 6
  eval_steps: 6

stage2_rollout_correction:
  pipeline:
    objective:
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        application:
          preset: rollout_self_prefix
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          duplicate_burst_prefix_rollback: true
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
    diagnostics: []
