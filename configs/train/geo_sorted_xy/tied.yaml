# Matched to archived four-coordinate-xy/step-2444 resolved_config.json.
schema_version: 1
extends: ../production.yaml
run:
  name: qwen3-vl-2b-geo-sorted-xy-tied-ebs24-4epoch
  artifact_root: /data/CoordExp/outputs/infra_base/train
model:
  base_model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
data:
  augmentation:
    train:
      geometry_flips:
        enabled: false
        horizontal_prob: 0.0
        vertical_prob: 0.0
  eval:
    path: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000_xy_sorted/val.coord.jsonl
    sample_limit: null
  train:
    path: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000_xy_sorted/train.coord.jsonl
    sample_limit: null
  train_order: source_order
template:
  assistant_format: object_box_closed
  object_field_order: desc_first
  object_ordering: geo_sorted_xy
  prompt:
    system: 'You are a general-purpose object detection and grounding assistant. Output one compact detection row
      per object by concatenating rows directly with no separator, no newline, and no extra text. Use this row pattern
      exactly: <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Descriptions are raw class text; bbox coords are four coord tokens in x1 y1 x2 y2 order.'
    user: 'Locate each clearly visible object instance in the image. Return compact rows using this exact pattern:
      <|object_ref_start|>{desc}<|object_ref_end|><|box_start|><|coord_100|><|coord_200|><|coord_300|><|coord_400|><|box_end|>.
      Use one row per object; concatenate rows directly with no separator and do not insert newline characters.
      Restrict `desc` to this COCO-80 class list: person, bicycle, car, motorcycle, airplane, bus, train, truck,
      boat, traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse, sheep, cow, elephant,
      bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports ball, kite,
      baseball bat, baseball glove, skateboard, surfboard, tennis racket, bottle, wine glass, cup, fork, knife,
      spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
      potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard, cell phone, microwave, oven,
      toaster, sink, refrigerator, book, clock, vase, scissors, teddy bear, hair drier, toothbrush.'
optimizer:
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  groups:
    adapters:
      aligner: null
      language:
        lr: 0.0002
        weight_decay: 0.0
      vision: null
    token_embeddings:
      lr: 0.0001
      weight_decay: 0.0
  kwargs: {}
  name: adamw_torch
  scheduler:
    kwargs: {}
    name: cosine_with_warmup
    warmup_ratio: 0.1
    warmup_steps: null
training:
  effective_batch_size: 24
  epochs: 4
  max_grad_norm: 1.0
  max_steps: null
  mode: supervised
  precision: bf16
checkpoint:
  every_fraction: 0.4
  save_final: true
  steps: []
eval:
  forward:
    every_fraction: 0.4
    steps: []
  inference:
    enabled: false
