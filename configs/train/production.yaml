# Canonical single-node training template. The launcher chooses the topology;
# effective_batch_size=48 supports the maintained 1-4 process interface and
# the explicit eight-process smoke. Exact state publication is opt-in; a new
# parent uses a null checkpoint path, and a continuation selects a checkpoint.
schema_version: 1

run:
  name: qwen3-vl-2b-coco-dora
  artifact_root: /data/CoordExp/outputs/infra_base/train
  collision_policy: timestamp

model:
  base_model: ../../model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  attn_implementation: flash_attention_2
  fa2_branch_proof: first_micro_step
  logits_memory_budget_bytes: 4000000000
  processor:
    do_resize: false
    max_raw_pixels: 1048576
    max_merged_visual_tokens: 4096
  special_token_embeddings:
    groups:
      coordinate_tokens: default_coord_0_999
      wrapper_tokens: default_object_box_wrappers

adapter:
  type: dora
  seed_mode: initialize_new
  target_towers: [language]
  target_modules: all_linear
  rank: 16
  alpha: 32
  dropout: 0.0
  bias: none

data:
  train:
    path: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000/train.coord.jsonl
  eval:
    path: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_len12000/val.coord.jsonl
  train_order: source_order

template:
  object_field_order: desc_first
  object_ordering: geo_sorted
  assistant_format: object_box_closed
  prompt:
    system: >-
      You are a general-purpose object detection and grounding assistant.
      Return one compact object row per visible instance, with no extra prose.
    user: >-
      Locate each clearly visible object instance in the image. Use the
      CoordExp object-box format and COCO class text.

packing:
  global_max_length: 12000
  policy: source_order_next_fit
  seed: 17
  worker_count: 1

losses:
  normalizer: segment_balanced
  protected:
    base_ce:
      weight: 1.0
    token_type_gate:
      mode: zero_weight_ablation
      weight: 0.0
      groups: [desc_text, schema, coordinate, eos]

optimizer:
  name: adamw_torch
  betas: [0.9, 0.999]
  epsilon: 1.0e-8
  groups:
    adapters:
      language:
        lr: 2.0e-4
        weight_decay: 0.0
    token_embeddings:
      lr: 1.0e-4
      weight_decay: 0.0
  scheduler:
    name: cosine_with_warmup
    warmup_ratio: 0.1

training:
  mode: supervised
  epochs: 4
  effective_batch_size: 48
  precision: bf16
  max_grad_norm: 1.0
  forward_input_provider_mode: synchronous

runtime:
  seed: 17
  determinism:
    mode: strict_cuda_replay_v1

eval:
  forward:
    steps: [1000]
  inference:
    enabled: false

checkpoint:
  steps: [1000]
  save_final: true

observability:
  steps: 10

resume:
  mode: disabled
