# Larger Stage-2 standard-COCO training-only preflight.
#
# Ablation: strengthen false-negative description CE while preserving the
# tail-append + sorted-order baseline.
#
# Note: stage2_ab.pipeline.objective is a list; list overrides replace
# wholesale, so this file restates the full objective list.

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_coco80_view_train64_noeval_128steps_tail_insert_sorted_order.yaml

training:
  run_name: smoke_128steps-coco80_view-train64-noeval-tail_insert-sorted_order-fn_desc2p0-fallback1p0-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/smoke/coco80_view_larger_preflight/train64_128steps_tail_insert_sorted_order_fn_desc2p0

stage2_ab:
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A, B]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 2.0
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: bbox_geo
        enabled: true
        weight: 1.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          smoothl1_weight: 1.0
          ciou_weight: 0.5
      - name: bbox_size_aux
        enabled: true
        weight: 1.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          log_wh_weight: 0.05
          oversize_penalty_weight: 0.0
          oversize_area_frac_threshold: null
          oversize_log_w_threshold: null
          oversize_log_h_threshold: null
          eps: 1.0e-6
      - name: coord_reg
        enabled: true
        weight: 1.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          coord_ce_weight: 0.02
          coord_gate_weight: 1.0
          text_gate_weight: 0.1
          soft_ce_weight: 0.1
          w1_weight: 0.02
          temperature: 1.0
          target_sigma: 2.0
          target_truncate: 8
