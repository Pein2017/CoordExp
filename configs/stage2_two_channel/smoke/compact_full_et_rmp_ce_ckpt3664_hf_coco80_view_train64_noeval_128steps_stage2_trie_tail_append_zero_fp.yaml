# Small Stage-2 trie-CE standard-COCO training-only preflight.
#
# Purpose:
# - keep the same trie objective surface as the train8 overfit probe
# - increase the train-side sample range to 64 examples
# - avoid eval so the run focuses on training dynamics and rollout stability

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_coco80_view_overfit_train8_noeval_64steps_stage2_trie_tail_append_zero_fp.yaml

training:
  run_name: smoke_128steps-coco80_view-train64-noeval-stage2_trie_ce-tail_append-zero_fp-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/smoke/coco80_view_stage2_trie_ce_preflight/tail_append_train64_noeval_128steps
  max_steps: 128

custom:
  train_sample_limit: 64
  val_sample_limit: 0
  object_ordering: random

stage2_ab:
  channel_b:
    insertion_order: tail_append

rollout_matching:
  train_monitor_dump:
    max_samples: 16
