# Tiny Stage-2 standard-COCO view ablation.
#
# Dataset surface:
# - annotation view: public_data/coco/views/coco80/full
# - image store: resolved from sibling meta.json to public_data/coco/images/res-1024
# - annotation policy: standard COCO80 only, no LVIS proxy

extends:
  - ./compact_full_et_rmp_ce_ckpt3664_hf_1step.yaml
  - ../../_shared/datasets/coco80_full_view_1024.yaml

training:
  run_name: smoke_2steps-coco80_view-fallback1p0-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/smoke/coco80_view_fallback_ablation/fallback1p0_2steps
  max_steps: 2
  eval_steps: 2
  save_strategy: "no"

custom:
  detection_sequence_format: compact_full
  object_ordering: random
  train_sample_limit: 8
  val_sample_limit: 4
  coord_tokens:
    enabled: true
    skip_bbox_norm: true

stage2_ab:
  channel_b:
    fallback_loss_weight: 1.0

rollout_matching:
  train_monitor_dump:
    max_samples: 8
  eval_monitor_dump:
    max_samples: 4
