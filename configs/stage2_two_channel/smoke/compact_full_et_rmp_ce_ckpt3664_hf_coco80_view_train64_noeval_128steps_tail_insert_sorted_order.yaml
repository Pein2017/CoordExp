# Larger Stage-2 standard-COCO training-only preflight.
#
# Purpose:
# - repeatedly expose the model to a larger 64-sample train slice
# - keep eval disabled so the signal is train-side rollout/memorization behavior
# - use the best tiny-probe ordering baseline: sorted dataset targets with
#   historical Channel-B FN tail append

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_coco80_view_overfit_train8_noeval_64steps.yaml

training:
  run_name: smoke_128steps-coco80_view-train64-noeval-tail_insert-sorted_order-fallback1p0-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/smoke/coco80_view_larger_preflight/train64_128steps_tail_insert_sorted_order
  max_steps: 128
  eval_strategy: "no"
  save_strategy: "no"

custom:
  train_sample_limit: 64
  val_sample_limit: 0
  object_ordering: sorted

stage2_ab:
  channel_b:
    insertion_order: tail_append

rollout_matching:
  train_monitor_dump:
    max_samples: 16
  eval_monitor_dump:
    max_samples: 0
