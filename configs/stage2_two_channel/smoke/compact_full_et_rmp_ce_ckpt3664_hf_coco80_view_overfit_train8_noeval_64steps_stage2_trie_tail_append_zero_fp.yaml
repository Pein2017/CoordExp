# Tiny Stage-2 trie-CE standard-COCO training-only overfit probe.
#
# Purpose:
# - test whether Channel-B can memorize the same 8 COCO80 training samples
# - use trie multiple-positive hard CE for rollout-aware forward supervision
# - avoid eval entirely so rollout validity and recall remain train-side diagnostics
# - keep this leaf standard COCO only; no LVIS proxy or runtime fusion

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_coco80_view_fallback1p0_2steps.yaml

training:
  run_name: smoke_64steps-coco80_view-overfit_train8-noeval-stage2_trie_ce-tail_append-zero_fp-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/smoke/coco80_view_stage2_trie_ce_overfit_probe/tail_append_train8_noeval_64steps
  max_steps: 64
  eval_strategy: "no"
  save_strategy: "no"

custom:
  train_jsonl: public_data/coco/views/coco80/full/train.jsonl
  train_sample_limit: 8
  val_sample_limit: 0
  object_ordering: random
  detection_sequence_format: compact_full
  coord_tokens:
    enabled: true
    skip_bbox_norm: true

stage2_ab:
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.0
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: stage2_trie_ce
        enabled: true
        weight: 1.0
        channels: [B]
        application:
          preset: rollout_trie_hard_ce
        config:
          support_weight: 1.0
          balance_weight: 1.0
          struct_weight: 1.0
          desc_weight: 1.0
          coord_hard_ce_weight: 1.0
          eos_weight: 1.0
          normalization: token_mean
      - name: bbox_geo
        enabled: false
        weight: 0.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          smoothl1_weight: 0.0
          ciou_weight: 0.0
      - name: bbox_size_aux
        enabled: false
        weight: 0.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          log_wh_weight: 0.0
          oversize_penalty_weight: 0.0
          oversize_area_frac_threshold: null
          oversize_log_w_threshold: null
          oversize_log_h_threshold: null
          eps: 1.0e-6
      - name: coord_reg
        enabled: false
        weight: 0.0
        channels: [A, B]
        application:
          preset: anchor_only
        config:
          coord_ce_weight: 0.0
          coord_gate_weight: 0.0
          text_gate_weight: 0.0
          soft_ce_weight: 0.0
          w1_weight: 0.0
          temperature: 1.0
          target_sigma: 2.0
          target_truncate: 8
    diagnostics: []
  channel_b:
    fallback_loss_weight: 0.25
    insertion_order: tail_append
    fp_policy:
      mode: zero_loss_context
    triage_posterior:
      num_rollouts: 4

rollout_matching:
  train_monitor_dump:
    enabled: true
    every_steps: 1
    every_channel_b_steps: 1
    max_events: 0
    max_samples: 8
    write_markdown: false
  eval_monitor_dump:
    enabled: false
    max_samples: 0
  eval_detection:
    enabled: false
    materialize_artifacts: false
