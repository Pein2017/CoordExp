# Compact-full Stage-2 smoke for the A2/support2 ET-RMP-CE checkpoint.
#
# Scope:
# - checkpoint: compact-full ET-RMP-CE support2 tokenrows_v2 checkpoint-3664
# - template surface: compact_full coord-token rows
# - rollout decode: HF, unconstrained, no compact grammar
# - stage: Channel-B pseudo-positive path with compact fallback diagnostics

extends: ../prod/ab_mixed_coco1024_bmajority_channel_b_pseudo_positive.yaml

model:
  model: model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  adapters:
    - /data/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest/compact_full_et_rmp_ce_support2_bsz16_4epoch_tokenrows_v2/compact-full-et-rmp-ce-support2-bsz16-4epoch-tokenrows-v2/v0-20260504-071356/checkpoint-3664

training:
  run_name: smoke_1step-compact_full-et_rmp_ce_ckpt3664-hf-unconstrained
  artifact_subdir: stage2_ab/smoke/compact_full_et_rmp_ce_ckpt3664_hf_1step
  max_steps: 1
  logging_steps: 1
  eval_strategy: "steps"
  eval_steps: 1
  save_strategy: "no"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  effective_batch_size: 8
  dataloader_drop_last: false

data:
  dataloader_num_workers: 0
  dataloader_prefetch_factor: null
  dataloader_persistent_workers: false

custom:
  detection_sequence_format: compact_full
  object_ordering: random
  train_sample_limit: 8
  val_sample_limit: 8
  coord_tokens:
    enabled: true
    skip_bbox_norm: true

stage2_ab:
  schedule:
    b_ratio: 1.0
  channel_b:
    rollout_template_family: compact_full
    rollout_decode_policy: unconstrained
    invalid_rollout_policy: fallback_gt_fn_append_only
    fallback_loss_weight: 1.0
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.3, 0.5, 0.7]

rollout_matching:
  rollout_backend: hf
  eval_rollout_backend: hf
  channel_b_decode_batch_size: 1
  eval_decode_batch_size: 1
  max_new_tokens: 3084
  decoding:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
  repetition_penalty: 1.1
  train_monitor_dump:
    enabled: true
    every_steps: 1
    every_channel_b_steps: 1
    max_events: 0
    max_samples: 4
    max_text_chars: 2048
    write_markdown: true
  eval_monitor_dump:
    enabled: true
    every_evals: 1
    max_events: 0
    max_samples: 4
    max_text_chars: 2048
    write_markdown: true
  eval_detection:
    enabled: true
    materialize_artifacts: true
    metrics: coco
    use_segm: false
    strict_parse: false
    score_mode: confidence_postop
    confidence:
      fusion_w_geom: 1.0
      fusion_w_desc: 0.0
