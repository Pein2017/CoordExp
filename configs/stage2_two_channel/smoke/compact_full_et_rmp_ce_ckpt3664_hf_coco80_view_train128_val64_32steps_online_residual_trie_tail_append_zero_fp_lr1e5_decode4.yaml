# Online residual-trie train128/val64 mini experiment.
#
# Live Channel-B performs 4 rollout attempts per sample, then immediately builds
# residual-trie teacher-forcing targets from those rollout views. This is the
# intended online diagnostic path; prepared-rollout JSONL is deliberately unused.

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_coco80_view_fallback1p0_2steps.yaml

global_max_length: 20000

training:
  run_name: mini_32steps-coco80_view-train128-val64-online_residual_trie-tail_append-zero_fp-lr1e5-decode4-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/mini/coco80_view_online_residual_trie_train128_val64/tail_append_zero_fp_lr1e5_decode4
  max_steps: 32
  logging_steps: 1
  eval_strategy: steps
  eval_steps: 16
  save_strategy: steps
  save_steps: 16
  save_total_limit: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  effective_batch_size: 16
  learning_rate: 1.0e-5
  vit_lr: 1.0e-5
  aligner_lr: 2.5e-5
  dataloader_drop_last: true

custom:
  train_jsonl: public_data/coco/views/coco80/full/train.jsonl
  train_sample_limit: 128
  val_sample_limit: 64
  object_ordering: random
  detection_sequence_format: compact_full
  coord_tokens:
    enabled: true
    skip_bbox_norm: true

stage2_ab:
  schedule:
    b_ratio: 1.0
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.0
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: stage2_trie_ce
        enabled: true
        weight: 1.0
        channels: [B]
        application:
          preset: rollout_trie_hard_ce
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
      - name: schema_format_ce
        enabled: true
        weight: 0.25
        channels: [B]
        application:
          preset: rollout_schema_format
        config:
          schema_ce_weight: 1.0
    diagnostics: []
  channel_b:
    ddp_phase_timeout_s: 600
    rollout_template_family: compact_full
    rollout_decode_policy: compact_grammar
    fallback_loss_weight: 0.25
    insertion_order: tail_append
    pseudo_positive:
      enabled: false
    fp_policy:
      mode: zero_loss_context
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.3, 0.5, 0.7]

rollout_matching:
  repetition_penalty: 1.10
  channel_b_decode_batch_size: 4
  eval_decode_batch_size: 4
  train_monitor_dump:
    enabled: true
    every_steps: 1
    every_channel_b_steps: 1
    max_events: 0
    max_samples: 16
    max_text_chars: 2048
    write_markdown: false
  eval_monitor_dump:
    enabled: true
    every_evals: 1
    max_events: 0
    max_samples: 16
    max_text_chars: 2048
    write_markdown: true
  eval_detection:
    enabled: true
    materialize_artifacts: true
    metrics: coco
    use_segm: false
    strict_parse: false
    score_mode: confidence_postop
