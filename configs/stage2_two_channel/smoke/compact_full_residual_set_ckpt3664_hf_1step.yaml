# Compact-full Stage-2 residual-set smoke for the A2/support2 ET-RMP-CE checkpoint.
#
# Scope:
# - checkpoint: compact-full ET-RMP-CE support2 tokenrows_v2 checkpoint-3664
# - template surface: compact_full coord-token rows
# - rollout decode: HF, unconstrained, no compact grammar
# - stage: Channel-B residual-set correction with strict UL consensus mining

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_1step.yaml

training:
  run_name: smoke_1step-compact_full-residual_set-ckpt3664-hf-unconstrained
  artifact_subdir: stage2_ab/smoke/compact_full_residual_set_ckpt3664_hf_1step

stage2_ab:
  schedule:
    b_ratio: 1.0
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: ["A"]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.5
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        channels: ["B"]
        application:
          preset: rollout_self_prefix
        config:
          rollin_policy: random_valid_branch
          rollin_resample_policy: fixed_event
          base_seed: 17
          coord_span_policy: bbox_tail_from_anchor
          strict_builder_invariants: true
          lambda_ul_promoted: 0.5
          lambda_continue_margin: 0.0
          continue_margin_m: 0.0
          coverage_strength: 0.0
          num_rollouts: 3
          min_ul_valid_rollouts: 3
          ul_consensus_ratio: 1.0
          ul_geometry:
            iou_min: 0.75
            center_distance_scale_max: 0.05
            area_ratio_max: 1.5
            aspect_ratio_max: 1.5
            consumed_overlap_iou_min: 0.75
          artifact_policy:
            ul_clusters: monitor_debug_smoke
  channel_b:
    pseudo_positive:
      enabled: false
    triage_posterior:
      num_rollouts: 3
