# Compact-full Stage-2 residual-set smoke for the A2/support2 ET-RMP-CE checkpoint.
#
# Scope:
# - checkpoint: compact-full ET-RMP-CE support2 tokenrows_v2 checkpoint-3664
# - template surface: compact_full coord-token rows
# - rollout decode: HF, unconstrained
# - stage: Channel-B residual-set correction from live rollouts

extends: ./compact_full_et_rmp_ce_ckpt3664_hf_1step.yaml

training:
  run_name: smoke_1step-compact_full-residual_set-ckpt3664-hf-unconstrained
  artifact_subdir: stage2_ab/smoke/compact_full_residual_set_ckpt3664_hf_1step
  eval_strategy: "no"

custom:
  val_sample_limit: 0

rollout_matching:
  eval_monitor_dump:
    enabled: false
  eval_detection:
    enabled: false
    materialize_artifacts: false

stage2_ab:
  schedule:
    b_ratio: 1.0
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.0
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: residual_set_correction
        enabled: true
        weight: 1.0
        channels: [B]
        application:
          preset: rollout_self_prefix
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
    diagnostics: []
  channel_b:
    pseudo_positive:
      enabled: false
