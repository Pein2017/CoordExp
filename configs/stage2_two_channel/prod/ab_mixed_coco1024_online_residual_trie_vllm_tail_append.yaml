# Production-candidate online residual-trie profile.
#
# Launch contract for the current 8-GPU host:
#   server_gpus=0,1,2,3,4,5 train_gpus=6,7
#
# This intentionally keeps native vLLM full-sync with decode batch size 4.
# Coord/schema token-row adapter effects are materialized into the runtime
# full-weight snapshot; checkpoints remain adapter-only.

extends:
  - ./ab_mixed.yaml
  - ../../_shared/datasets/coco_1024_bbox_max60.yaml

global_max_length: 20000

model:
  model: model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  adapters:
    - /data/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest/compact_full_et_rmp_ce_support2_bsz16_4epoch_tokenrows_v2/compact-full-et-rmp-ce-support2-bsz16-4epoch-tokenrows-v2/v0-20260504-071356/checkpoint-3664

training:
  num_train_epochs: 1
  run_name: online_residual_trie-k4-selfrollout-tail_append-schemafmt-zero_fp-lr1e5-decode4-vllm6srv2lr-compact_full-et_rmp_ce_ckpt3664
  artifact_subdir: stage2_ab/prod/online_residual_trie_selfrollout_tail_append_schemafmt_zero_fp_lr1e5_decode4_vllm6srv2lr
  learning_rate: 1.0e-5
  vit_lr: 1.0e-5
  aligner_lr: 2.5e-5
  eval_strategy: steps
  eval_steps: 300
  save_strategy: steps
  save_steps: 300
  save_total_limit: 3
  dataloader_drop_last: true

custom:
  detection_sequence_format: compact_full
  object_ordering: random
  coord_tokens:
    enabled: true
    skip_bbox_norm: true

stage2_ab:
  schedule:
    b_ratio: 1.0
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.0
          rollout_global_prefix_struct_ce_weight: 1.0
      - name: stage2_trie_ce
        enabled: true
        weight: 1.0
        channels: [B]
        application:
          preset: rollout_trie_hard_ce
        config:
          expected_num_rollouts: 4
          base_seed: 17
          lambda_type: 1.0
          lambda_inner: 1.0
          fallback_loss_weight: 1.0
          lambda_ul_promoted: 0.5
          label_conflict_weight: 0.25
          commit_iou_threshold: 0.75
          duplicate_burst_iou_threshold: 0.95
          ul_cluster_iou_threshold: 0.9
          ul_gray_iou_low: 0.30
          ul_consensus_ratio: 1.0
          min_ul_valid_rollouts: 4
          clean_gt_sft_mix: 0
          strict_builder_invariants: true
      - name: schema_format_ce
        enabled: true
        weight: 0.25
        channels: [B]
        application:
          preset: rollout_schema_format
        config:
          schema_ce_weight: 1.0
    diagnostics: []
  channel_b:
    ddp_phase_timeout_s: 600
    rollout_template_family: compact_full
    rollout_decode_policy: compact_grammar
    strict_rollout_preflight: false
    invalid_rollout_policy: fallback_gt_fn_append_only
    fallback_loss_weight: 0.25
    insertion_order: tail_append
    pseudo_positive:
      enabled: false
    fp_policy:
      mode: zero_loss_context
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.3, 0.5, 0.7]

rollout_matching:
  rollout_backend: vllm
  eval_rollout_backend: vllm
  channel_b_decode_batch_size: 4
  eval_decode_batch_size: 4
  repetition_penalty: 1.10
  max_new_tokens: 3084
  train_monitor_dump:
    enabled: true
    every_steps: 40
    every_channel_b_steps: 40
    max_events: 0
    max_samples: 30
    max_text_chars: 0
    write_markdown: false
  eval_monitor_dump:
    enabled: true
    every_evals: 1
    max_events: 0
    max_samples: 30
    max_text_chars: 0
    write_markdown: false
  eval_detection:
    enabled: true
    materialize_artifacts: true
    metrics: coco
    use_segm: false
    strict_parse: false
    score_mode: confidence_postop
    confidence:
      fusion_w_geom: 1.0
      fusion_w_desc: 0.0
  vllm:
    mode: server
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_model_len: 20000
    enable_lora: false
    enable_prefix_caching: true
    enforce_eager: true
    disable_custom_all_reduce: true
    sync:
      mode: full
    mm_processor_kwargs:
      do_resize: false
    server:
      timeout_s: 240.0
      infer_timeout_s: 240.0
      servers:
        - base_url: http://127.0.0.1:8000
          group_port: 51216
