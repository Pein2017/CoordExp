extends:
  - ./ab_mixed.yaml
  - ../../_shared/datasets/coco_1024_bbox_max60.yaml

model:
  model: output/stage2_ab/prod/pseudo_positive-ckpt_300_merged-v1

training:
  num_train_epochs: 1
  run_name: k_4-eff_size_96-b_ratio_0.85-epoch_1-global_struct_ce_fixed-stronger_FN-from_300_v1
  artifact_subdir: stage2_ab/prod/pseudo_positive

stage2_ab:
  schedule:
    b_ratio: 0.85
  pipeline:
    objective:
      - name: token_ce
        enabled: true
        weight: 1.0
        channels: [A, B]
        application:
          preset: anchor_text_only
        config:
          desc_ce_weight: 1.0
          rollout_fn_desc_weight: 1.5
          rollout_global_prefix_struct_ce_weight: 1.0
  channel_b:
    duplicate_control:
      iou_threshold: 0.95
      center_radius_scale: 0.8
    invalid_rollout_policy: dump_and_continue
    pseudo_positive:
      enabled: true
      coord_weight: 0.3
    triage_posterior:
      num_rollouts: 4
      rollout_temperatures: [0.0, 0.7, 0.7, 0.7]
      explorer_temperature: 0.7
      explorer_top_p: 0.95
      explorer_top_k: 64
      unlabeled_consistent_iou_threshold: 0.9
      recovered_ground_truth_weight_multiplier: 3.0

rollout_matching:
  train_monitor_dump:
    every_channel_b_steps: 30
  max_new_tokens: 3084
  vllm:
    gpu_memory_utilization: 0.9
