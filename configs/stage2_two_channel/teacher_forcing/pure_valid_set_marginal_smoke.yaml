template:
  template: qwen3_vl

custom:
  train_jsonl: toy/train.jsonl
  val_jsonl: toy/val.jsonl
  user_prompt: "{bbox}"
  emit_norm: none
  json_format: standard
  object_field_order: desc_first
  trainer_variant: stage2_two_channel

training:
  run_name: stage2-teacher-forcing-pure-valid-set-marginal-smoke
  per_device_train_batch_size: 1
  effective_batch_size: 1
  packing: false

objective:
  id: teacher_forcing
  profile: pure_valid_set_marginal
  target_ir:
    rollin_policy:
      name: random_permutation
      base_seed: 17
    exact_packing_mapping:
      enabled: false
  modules:
    token_type_mass:
      enabled: true
    conditional_valid_set_likelihood:
      enabled: true
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: false

rollout_matching:
  rollout_backend: hf
  channel_b_decode_batch_size: 1
  eval_decode_batch_size: 1

stage2_ab:
  schedule:
    b_ratio: 1.0
  pipeline:
    objective: []
    diagnostics: []
  channel_b: {}
