# Compact-full prefix-rollin ET-RMP-CE separator-continue ablation.
#
# This keeps E1 balance/support/type-gate/EOS settings intact and changes only
# the append-boundary role weights. It is meant to diagnose and counter the
# observed generated-prefix failure where `\n` loses to `<|im_end|>` before the
# model can emit the next `<|object_ref_start|>`.

extends:
  - ./compact_full_prefix_rollin_balance2.yaml

training:
  artifact_subdir: compact_full_prefix_rollin_separator2_e2
  run_name: compact-full-prefix-rollin-separator2-e2
  eval_steps: 600

objective:
  boundary:
    type: compact_full_append_boundary
    separator_continue_weight: 2.0
    eos_stop_weight: 0.5
    component_weight: 0.3

experiment:
  surface: ablation
  ablation_id: E2-separator2
  claim_scope: none
