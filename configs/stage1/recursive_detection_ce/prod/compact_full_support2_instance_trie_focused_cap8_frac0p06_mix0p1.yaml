# Focused cap8/6%/mix0.1 slope ablation config. This keeps the same capped R95
# radius policy as the main focused config but uses a larger axis fraction
# before the cap applies.
extends:
  - ./compact_full_support2.yaml

training:
  save_model_only: true
  artifact_subdir: compact_full_et_rmp_instance_trie_focused_cap8_frac0p06_mix0p1_support2_bsz16_8gpu_4epoch_tokenrows_v2
  run_name: compact-full-et-rmp-instance-trie-focused-cap8-frac0p06-mix0p1-support2-bsz16-8gpu-4epoch-tokenrows-v2

objective:
  type_gate:
    enabled: true
    mode: allowed_type_mass
    weights:
      struct: 1.0
      desc: 1.0
      coord: 1.0
      eos: 0.5
  coord_soft_ce:
    enabled: true
    target_distribution: instance_trie_gaussian
    gaussian_mixture_weight: 0.1
    gaussian_r95_axis_fraction: 0.06
    gaussian_r95_cap_bins: 8

experiment:
  surface: ablation
  ablation_id: cap8_frac0p06_mix0p1
  claim_scope: none

