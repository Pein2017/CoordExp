extends:
  - ./compact_full_prefix_denoising_kl_w0p05.yaml

# Production launch leaf for prefix-denoising SFT V1.
#
# Contract:
# - start from the 2B coord base checkpoint in model_cache, with no warm-start adapter
# - train 2 epochs on sorted compact-full data
# - use marker-delimited compact rows, i.e. no "\n" object separator
# - evaluate on a deterministic 512-row validation subset
# - keep eval packing disabled: current teacher_forcing guard rejects eval_packing=true
# - optimize branch-balanced clean/noisy hard CE plus local coord KL at weight 0.05
# - use static packing only to group train samples; the prefix-denoising
#   objective replays clean/noisy branches as isolated forwards for CE/KL

training:
  artifact_subdir: compact_full_prefix_denoising_kl_w0p05_2b_base_sorted_marker_bsz1x128_2epoch
  run_name: compact-full-prefix-denoising-kl-w0p05-2b-base-sorted-marker-bsz1x128-2epoch
  num_train_epochs: 2
  per_device_train_batch_size: 1
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  eval_packing: false
  save_delay_steps: 200
  static_packing_cache:
    root_dir: /data/CoordExp/outputs/stage1_2b/detection_teacher_forcing/static_packing/compact_full_prefix_denoising_2b_base_sorted_marker

debug:
  # Detection configs currently route {train,val}_sample_limit through debug.
  enabled: true
  val_sample_limit: 512
