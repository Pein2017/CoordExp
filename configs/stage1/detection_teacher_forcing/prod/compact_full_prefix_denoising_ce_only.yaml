extends:
  - ./compact_full_support2.yaml

# Prefix-denoising CE-only ablation.
# This uses the V1 hybrid A+B packed path:
#   clean_full CE + noisy_full CE, both with clean labels, no KL term.

training:
  artifact_subdir: compact_full_prefix_denoising_ce_only_bsz1x128_4epoch
  run_name: compact-full-prefix-denoising-ce-only-bsz1x128-4epoch
  per_device_train_batch_size: 1
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  train_type: lora
  use_dora: true
  freeze_llm: false
  freeze_vit: true
  freeze_aligner: true
  target_modules: [all-linear]
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  packing: true
  packing_mode: static
  packing_min_fill_ratio: 0.7
  packing_drop_last: true
  packing_length_precompute_workers: 8
  eval_packing: false
  encoded_sample_cache:
    enabled: false

model:
  model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  model_type: qwen3_vl

data:
  train_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60/train.coord.jsonl
  val_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  image_root: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60
  object_ordering: sorted

objective:
  id: teacher_forcing
  profile: hard_sft
  target_ir: null
  modules:
    token_type_mass:
      enabled: false
    conditional_valid_set_likelihood:
      enabled: false
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: false

prefix_denoising:
  enabled: true
  noise:
    center_shift_frac: 0.08
    uniform_scale_range: [0.92, 1.08]
  current_object_kl:
    weight: 0.0
    window_radius: 8
    num_objects_per_image: 1

packing:
  static_packing: true
  padding_free_packed: false
