extends:
  - ./compact_support2.yaml

# Prefix-denoising CE-only ablation with full schema-wrapper compact rows.
# This uses the V1 hybrid A+B packed path:
#   clean_full CE + noisy_full CE, both with clean labels, no KL term.

training:
  artifact_subdir: compact_object_box_closed_prefix_denoising_ce_only_bsz1x128_4epoch
  run_name: compact-object-box-closed-prefix-denoising-ce-only-bsz1x128-4epoch
  per_device_train_batch_size: 1
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  train_type: lora
  use_dora: true
  freeze_llm: false
  freeze_vit: true
  freeze_aligner: true
  target_modules: [all-linear]
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  packing: true
  packing_mode: static
  packing_min_fill_ratio: 0.7
  packing_drop_last: true
  packing_length_precompute_workers: 8
  eval_packing: false
  encoded_sample_cache:
    enabled: false

model:
  model: /data/CoordExp/model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  model_type: qwen3_vl

data:
  train_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60/train.coord.jsonl
  val_jsonl: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  image_root: /data/CoordExp/public_data/coco/rescale_32_1024_bbox_max60
  object_ordering: sorted

detection_template:
  id: compact_object_box_closed
  coordinate_surface: coord_token
  bbox_format: xyxy
  strict_parse: true

token_rows:
  enabled: true
  tie_head: true
  groups:
    coord_geometry:
      role: coord_geometry
      start_token: "<|coord_0|>"
      end_token: "<|coord_999|>"
      expected_start: 151670
      expected_end: 152669
    compact_structure:
      role: structural_ce_only
      tokens:
        - "<|object_ref_start|>"
        - "<|object_ref_end|>"
        - "<|box_start|>"
        - "<|box_end|>"
      expected_ids:
        "<|object_ref_start|>": 151646
        "<|object_ref_end|>": 151647
        "<|box_start|>": 151648
        "<|box_end|>": 151649
  embed_lr: 5.0e-5
  head_lr: 5.0e-5
  weight_decay: 0.0

objective:
  id: teacher_forcing
  profile: hard_sft
  target_ir: null
  modules:
    token_type_mass:
      enabled: false
    conditional_valid_set_likelihood:
      enabled: false
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: false

prefix_denoising:
  enabled: true
  noise:
    center_shift_frac: 0.08
    uniform_scale_range: [0.92, 1.08]
  current_object_kl:
    weight: 0.0
    window_radius: 8
    num_objects_per_image: 1

packing:
  static_packing: true
  padding_free_packed: false

evaluation:
  expected_template: compact_object_box_closed
  parser_mode: strict_expected
