extends:
  - ./compact_object_box_closed_prefix_denoising_kl_w0p05_k2.yaml

# Production launch leaf for prefix-denoising SFT V1, random-order full-wrapper variant.
#
# Clean and noisy branches share the same sampled object order per image.

training:
  artifact_subdir: compact_object_box_closed_prefix_denoising_kl_w0p05_k2_2b_base_random_bsz1x128_4epoch
  run_name: compact-object-box-closed-prefix-denoising-kl-w0p05-k2-2b-base-random-bsz1x128-4epoch
  num_train_epochs: 4
  per_device_train_batch_size: 1
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  eval_packing: false
  save_delay_steps: 200
  static_packing_cache:
    root_dir: /data/CoordExp/outputs/stage1_2b/detection_teacher_forcing/static_packing/compact_object_box_closed_prefix_denoising_2b_base_random

data:
  object_ordering: random_permutation

debug:
  # Detection configs currently route {train,val}_sample_limit through debug.
  enabled: true
  val_sample_limit: 512
