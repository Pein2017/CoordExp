# Production Stage-1 coverage-ledger teacher-forcing config.
#
# This uses Stage-1 static packing: per-rank physical batch size stays 1, while
# each packed row contains multiple one-image samples with isolated attention.
extends:
  - ./compact_support2.yaml

model:
  model: model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp-natural-adjacent
  adapters:
    - /data/CoordExp/outputs/stage1_2b/adapter_views/pure_ce_sorted_checkpoint_928_token_embeddings_adapter-5e5zj73f

detection_template:
  id: compact_object_box_closed

sample_factory:
  target_sequence:
    object_ordering: sorted

token_embeddings_adapter:
  embed_lr: 2.0e-5
  groups:
    compact_structure:
      role: structural_ce_only
      tokens:
        - "<|object_ref_start|>"
        - "<|object_ref_end|>"
        - "<|box_start|>"
        - "<|box_end|>"
      expected_ids:
        "<|object_ref_start|>": 151646
        "<|object_ref_end|>": 151647
        "<|box_start|>": 151648
        "<|box_end|>": 151649

objective:
  profile: hard_sft
  target_ir:
    rollin_policy:
      name: sorted
  terms:
    token_type_mass:
      enabled: true
      weight: 1.0
    conditional_valid_set_likelihood:
      enabled: false
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: true
      weight: 0.2
    bbox_positive_area:
      enabled: false
    coverage_ledger:
      enabled: true
      coverage_weight: 0.1
      region_anchor_weight: 0.1
      ledger_projection_dim: 256
      temperature: 0.2
      normalize_eps: 1.0e-6
      pos_weight: 1.0
      log_auc: true
      log_accuracy: true
      overlay_sample_count: 16
      smoke_sample_count: 128
      smoke_sample_seed: 20260623

packing:
  static_packing: true
  padding_free_packed: false

evaluation:
  expected_template: compact_object_box_closed
  parser_mode: strict_expected

training:
  artifact_subdir: coverage_ledger_closed_hard_sft_bsz32_2epoch
  run_name: coverage-ledger-closed-hard-sft-bsz32-2epoch
  num_train_epochs: 2
  learning_rate: 2.0e-5
  per_device_train_batch_size: 1
  effective_batch_size: 32
  per_device_eval_batch_size: 1
  packing: true
  eval_packing: true
