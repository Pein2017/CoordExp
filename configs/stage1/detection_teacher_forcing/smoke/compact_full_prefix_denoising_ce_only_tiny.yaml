extends:
  - ../prod/compact_full_prefix_denoising_ce_only.yaml
  - ./common_prodlike.yaml

training:
  artifact_subdir: compact_full_prefix_denoising_ce_only_tiny
  run_name: smoke-compact-full-prefix-denoising-ce-only-tiny
  max_steps: 2
  per_device_train_batch_size: 1
  effective_batch_size: 1
  per_device_eval_batch_size: 1
  packing_min_fill_ratio: 0.1
  packing_drop_last: false
  packing_length_precompute_workers: 1
  static_packing_cache:
    root_dir: temp/static_packing_smoke/prefix_denoising_ce_only_tiny

debug:
  enabled: true
  train_sample_limit: 4
  val_sample_limit: 1
