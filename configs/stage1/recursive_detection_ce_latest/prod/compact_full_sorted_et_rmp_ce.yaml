# Fully-compact full-object sorted-order ET-RMP-CE with LLM+aligner LoRA.
extends:
  - ./compact_full_ablation_base.yaml

training:
  artifact_subdir: compact_full_fullobj_sorted_et_rmp_ce_support2_llm_aligner_lora_bsz16_4epoch_tokenrows_v2
  run_name: compact-full-fullobj-sorted-et-rmp-ce-support2-llm-aligner-lora-bsz16-4epoch-tokenrows-v2

data:
  object_ordering: sorted

objective:
  id: teacher_forcing
  profile: pure_valid_set_marginal
  target_ir:
    rollin_policy:
      name: sorted
      base_seed: 17
    exact_packing_mapping:
      enabled: false
  modules:
    token_type_mass:
      enabled: false
    conditional_valid_set_likelihood:
      enabled: false
    within_valid_coverage:
      enabled: false
      coverage_strength: 0.0
    continuation_margin:
      enabled: false
