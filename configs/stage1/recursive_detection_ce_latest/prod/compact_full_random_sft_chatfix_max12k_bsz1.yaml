# Fresh production ablation config for compact-full random-order SFT.
#
# Purpose:
# - restart SFT from the stable base model cache, not from a partial adapter
# - keep one long detection sequence per GPU forward/backward microstep
# - preserve the original 12000 token cap now that per-device microbatch is 1
# - preserve global effective batch 128; gradient accumulation is derived
extends:
  - ./compact_full_random_sft.yaml

template:
  max_length: 12000

training:
  artifact_subdir: compact_full_random_sft_bsz1_ebs128_4epoch_tokenrows_v4_chatfix_max12k
  run_name: compact-full-random-sft-bsz1-ebs128-4epoch-tokenrows-v4-chatfix-max12k
  per_device_train_batch_size: 1
  effective_batch_size: 128
