# A2E clean ablation: A2/support2 ET-RMP-CE plus missing-label-aware EOS
# trust weighting. The base model, data, compact-full template, token rows,
# optimizer, schedule, support/balance coefficients, and full-sequence
# teacher-forced supervision are inherited from compact_full_support2.yaml.
extends:
  - ./compact_full_support2.yaml

training:
  artifact_subdir: compact_full_support2_eos_loosen
  run_name: compact-full-support2-eos-loosen-a2e

objective:
  eos:
    eos_token: "<|im_end|>"
    policy: missing_label_prior_weighted_ce
    eos_trust_weight:
      source: empirical_unlabeled_poisson_v0
      expected_unlabeled_count:
        intercept: -0.35
        slope: 0.43
        floor: 0.0
      trust_mapping:
        type: log_linear_missing_count_penalty
        penalty_per_missing: 1.0
        temperature: 1.0
        min_weight: 0.0
        max_weight: 1.0

experiment:
  surface: ablation
  ablation_id: A2E-support2-eos-loosen
  claim_scope: none
