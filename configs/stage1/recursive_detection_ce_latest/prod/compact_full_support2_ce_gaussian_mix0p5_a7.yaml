# A7 CE-anchored Gaussian ablation config: A2/support2 ET-RMP with an equal
# 1:1 target mixture between exact coordinate CE and the instance-trie Gaussian
# coordinate target. This is intentionally separate from A6 mix0p2 so smoke
# evidence can decide whether the broader 0.5 smoothing is too diffuse.
extends:
  - ./compact_full_support2.yaml

training:
  save_model_only: true
  artifact_subdir: compact_full_et_rmp_ce_gaussian_mix0p5_a7_support2_bsz16_8gpu_4epoch_tokenrows_v2
  run_name: compact-full-et-rmp-ce-gaussian-mix0p5-a7-support2-bsz16-8gpu-4epoch-tokenrows-v2

objective:
  coord_soft_ce:
    enabled: true
    target_distribution: instance_trie_gaussian
    gaussian_mixture_weight: 0.5

experiment:
  surface: ablation
  ablation_id: A7-ce-gaussian-mix0p5
  claim_scope: none
