# Fresh production ablation config for compact-full random-order SFT.
#
# Purpose:
# - restart SFT from the stable base model cache, not from a partial adapter
# - use the shared image-before-text chat builder introduced for train/infer parity
# - keep the compact_full coord-token representation and random object order
# - finish the full 4-epoch schedule
# - lower template.max_length slightly from 12000 to 10000 to reduce OOM risk
extends:
  - ./compact_full_random_sft.yaml

template:
  max_length: 10000

training:
  artifact_subdir: compact_full_random_sft_bsz16_4epoch_tokenrows_v3_chatfix_max10k
  run_name: compact-full-random-sft-bsz16-4epoch-tokenrows-v3-chatfix-max10k
