# A5-instance-trie-gaussian ablation config: A2/support2 ET-RMP with
# instance-trie Gaussian coord SoftCE. The base model, data, compact-full
# template, token rows, optimizer, schedule, batch semantics, and
# support/balance coefficients are inherited from compact_full_support2.yaml.
extends:
  - ./compact_full_support2.yaml

training:
  save_model_only: true
  artifact_subdir: compact_full_et_rmp_instance_trie_gaussian_softce_a5_support2_bsz16_8gpu_4epoch_tokenrows_v2
  run_name: compact-full-et-rmp-instance_trie_gaussian_softce_a5-support2-bsz16-8gpu-4epoch-tokenrows-v2

objective:
  coord_soft_ce:
    enabled: true
    target_distribution: instance_trie_gaussian

experiment:
  surface: ablation
  ablation_id: A5-instance-trie-gaussian
  claim_scope: none
