# Fully-compact full-object random-order hard-CE SFT with LLM+aligner LoRA.
extends:
  - ./compact_full_ablation_base.yaml

training:
  artifact_subdir: compact_full_fullobj_random_sft_llm_aligner_lora_packed_bsz16_4epoch_tokenrows_v2
  run_name: compact-full-fullobj-random-sft-llm-aligner-lora-packed-bsz16-4epoch-tokenrows-v2
