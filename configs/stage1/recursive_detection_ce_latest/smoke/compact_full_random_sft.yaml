extends:
  - ../prod/compact_full_support2.yaml
  - ./common_prodlike.yaml

training:
  artifact_subdir: compact_full_random_sft
  run_name: smoke-compact-full-random-sft
  max_steps: 2
  per_device_train_batch_size: 4
  effective_batch_size: 4
  per_device_eval_batch_size: 1

debug:
  enabled: true
  train_sample_limit: 64
  val_sample_limit: 8

prompt:
  prompt_variant_enabled: false

objective:
  id: sft
  variant: random_order_sft
  trie_support_weight: 0.0
  trie_balance_weight: 0.0
  state_weighting: none
  normalization: token_mean
