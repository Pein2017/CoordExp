# A3 ablation config: compact-full prefix roll-in ET-RMP-CE with support+balance.
#
# The stop token receives ordinary teacher-forced CE.
model:
  model: model_cache/models/Qwen/Qwen3-VL-2B-Instruct-coordexp
  attn_impl: flash_attention_2
  torch_dtype: bfloat16

template:
  template: qwen3_vl
  truncation_strategy: raise
  max_length: 12000
  max_pixels: 1048576

training:
  output_root: /data/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest
  logging_root: /data/CoordExp/outputs/stage1_2b/recursive_detection_ce_latest/tb
  artifact_subdir: compact_full_prefix_rollin_et_rmp_ce_balance2_a3_bsz1_ebs128
  run_name: compact-full-prefix-rollin-et-rmp-ce-balance2-a3-bsz1-ebs128
  num_train_epochs: 4
  per_device_train_batch_size: 1
  effective_batch_size: 128
  per_device_eval_batch_size: 1
  learning_rate: 5.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.1
  lr_scheduler_type: cosine
  optimizer: multimodal_coord_offset
  optim: adamw_torch_fused
  train_type: lora
  freeze_vit: true
  freeze_aligner: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  remove_unused_columns: false
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  packing: false
  eval_packing: false
  encoded_sample_cache:
    enabled: false
  eval_strategy: steps
  eval_steps: 600
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  save_delay_steps: 600
  logging_steps: 10
  logging_first_step: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  ddp_find_unused_parameters: false
  ddp_broadcast_buffers: false

deepspeed:
  enabled: false

data:
  train_jsonl: public_data/coco/rescale_32_1024_bbox_max60/train.coord.jsonl
  val_jsonl: public_data/coco/rescale_32_1024_bbox_max60/val.coord.jsonl
  image_root: public_data/coco/rescale_32_1024_bbox_max60
  max_objects: 60
  object_ordering: random_permutation

prompt:
  system_variant: stage1_detection
  user_variant: compact_detection
  include_template_summary: true
  prompt_variant_enabled: true

detection_template:
  id: compact_full
  coordinate_surface: coord_token
  bbox_format: xyxy
  strict_parse: true

token_rows:
  enabled: true
  tie_head: true
  groups:
    coord_geometry:
      role: coord_geometry
      start_token: "<|coord_0|>"
      end_token: "<|coord_999|>"
      expected_start: 151670
      expected_end: 152669
    compact_structure:
      role: structural_ce_only
      tokens: ["<|object_ref_start|>", "<|box_start|>"]
      expected_ids:
        "<|object_ref_start|>": 151646
        "<|box_start|>": 151648
  embed_lr: 5.0e-5
  weight_decay: 0.0

objective:
  id: recursive_detection_ce
  variant: prefix_rollin_et_rmp_ce
  state_weighting: uniform_permutation
  normalization: semantic_image_bucket_balanced
  rollin:
    enabled: true
    source: ground_truth
    prefix_loss: masked
    suffix_order: same_sampled_permutation
    k_distribution:
      type: uniform_inclusive
      min_k: 0
      max_k: object_count
  target:
    type: entry_trie_support_balance
    trie_scope: object_entry
    q_weighting: object_multiplicity_uniform
    singleton: hard_ce
    control_tokens: hard_ce
    support_weight: 1.0
    balance_weight: 2.0
  type_gate:
    enabled: true
    mode: allowed_type_mass
    weights:
      struct: 2.0
      coord: 1.0
      desc: 0.2
      eos: 0.5
packing:
  static_packing: false
  padding_free_packed: false

evaluation:
  expected_template: compact_full
  parser_mode: strict_expected

validation:
  validate_span_alignment: true
  validate_template_capabilities: true
  fail_fast: true

experiment:
  surface: ablation
  ablation_id: A3-prefix-rollin-support-balance
  claim_scope: none
