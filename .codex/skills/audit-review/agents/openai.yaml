interface:
  display_name: "Audit Review"
  short_description: "Deep code/spec/design audit (read-only)"
  default_prompt: "Audit the requested CoordExp code/spec/design/artifact/change. Follow source precedence: current docs and repo behavior first, stable openspec/specs only for compatibility contracts, active changes only when explicitly in scope, and progress as historical evidence. Use rg/RTK for discovery and Serena for narrowed Python symbols, stay read-only, and report P0/P1/P2 findings with file:line evidence, benchmark scope, artifact/provenance risks, and concrete verification steps."
