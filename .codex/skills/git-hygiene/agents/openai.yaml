interface:
  display_name: "Git Hygiene"
  short_description: "Safe worktrees, scoped commits, and sync"
  default_prompt: "Use $git-hygiene for CoordExp worktree isolation, scoped staging and commits, branch cleanup, remote sync, push, or the HTTPS token workflow. Work in the user-named checkout, preserve unrelated dirt, verify staged changes, and require explicit scope for destructive Git operations."
