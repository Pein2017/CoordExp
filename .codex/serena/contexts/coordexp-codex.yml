description: Codex with Serena initially bound to the current worktree and able to switch projects explicitly.
prompt: |
  Use Serena for precise code-symbol navigation and language-server-backed refactoring.
  Use Codex shell and file tools for text search, file operations, and ordinary edits.
  The initial Serena project is the current worktree.
  When a task moves to another folder or worktree, call activate_project with its absolute path and verify the activation receipt before using symbol tools.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - replace_content
  - replace_in_files
  - search_for_pattern
  - find_file
  - list_dir

included_optional_tools: []
single_project: false
structured_tool_output: true
