description: Minimal official Serena context for one Agent session and one active worktree.
prompt: |
  This Serena process and its active-project state are private to this agent.
  Activate the exact worktree before semantic work; reactivate after switching.
  Prefer symbol tools for code navigation, references, and diagnostics; read bodies as needed.
  Use semantic edits where appropriate, reading a symbol before replacing it.
  Use native tools for lexical search, non-code files, diffs, tests, and local text edits.
  Do not use Serena memories or duplicate native file tools. Report Serena failures.

fixed_tools:
  - initial_instructions
  - activate_project
  - get_current_config
  - search_for_pattern
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - find_implementations
  - find_declaration
  - get_diagnostics_for_file
  - get_diagnostics_for_symbol
  - rename_symbol
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol

single_project: false
structured_tool_output: true
