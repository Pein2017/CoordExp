description: Minimal official Serena context for one Agent session and one active worktree.
prompt: |
  This official Serena stdio process is private to this Agent session. It starts from
  the nearest Git worktree and does not share active-project state with other Agents.
  Use Serena first for source-code symbol overview, declaration, reference,
  implementation, and diagnostics queries. Use the Agent's native shell and file tools
  for lexical search, non-code files, diffs, tests, and edits. Do not use Serena memories.
  Before semantic work, use activate_project to confirm the intended absolute worktree.
  If the shell moves to another worktree, call activate_project for that exact root before
  the next semantic query. Report any Serena friction or transport failure to the user.

fixed_tools:
  - initial_instructions
  - activate_project
  - get_current_config
  - search_for_pattern
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - find_implementations
  - find_declaration
  - get_diagnostics_for_file
  - get_diagnostics_for_symbol
  - rename_symbol
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol

single_project: false
structured_tool_output: true
