description: Minimal official Serena context shared by Agents in one Git worktree.
prompt: |
  This Serena process is shared by Agents started in the same Git worktree and is
  permanently bound to that exact startup worktree.
  Use Serena first for source-code symbol overview, declaration, reference,
  implementation, and diagnostics queries. Use the Agent's native shell and file tools
  for lexical search, non-code files, diffs, tests, and edits. Do not use Serena memories.
  You may activate or confirm the bound worktree, but never switch this shared process to another project.
  If the shell moves to another worktree, start a fresh Agent there so it receives an isolated
  Serena runtime. Report Serena friction to the user.

fixed_tools:
  - initial_instructions
  - activate_project
  - get_current_config
  - search_for_pattern
  - get_symbols_overview
  - find_symbol
  - find_referencing_symbols
  - find_implementations
  - find_declaration
  - get_diagnostics_for_file
  - get_diagnostics_for_symbol
  - rename_symbol
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol

single_project: true
structured_tool_output: true
