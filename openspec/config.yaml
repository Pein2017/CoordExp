schema: spec-driven

context: |
  CoordExp is a neutral training-infrastructure base. The package is src and
  stable command entrypoints use python -m. Current product contracts cover
  training and packing, COCO/LVIS data provenance, checkpoint artifacts,
  HF/vLLM inference with direct evaluation, and operations.

rules:
  specs:
    - Encode only observable compatibility behavior.
    - Keep data, geometry, templates, tokens, packing, checkpoints, inference, and evaluation aligned.
    - Preserve fail-closed exact-resume, cache, payload, and qualification boundaries.
  changes:
    - State scope, non-goals, protected semantics, and the acceptance evidence required.
    - Do not use historical receipts or superseded routes as current authority.
