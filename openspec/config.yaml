schema: spec-driven

context: |
  This is canonical research-probes at /data/CoordExp/.worktrees/research-probes.
  Read /data/CoordExp/.codex/AGENTS.md if not already loaded for authority,
  research/engineering discipline and bounded review. Project routing is in
  AGENTS.md; /data/CoordExp/docs/AGENT_INDEX.md owns local environment and
  CoordExp design priorities. Siblings are separate versioned checkouts.
  probes/README.md owns source/test placement; research/CONVENTIONS.md owns
  knowledge, evidence and current-source qualification. Scientific questions,
  cohorts, metrics and stop rules remain with the research unit, not reusable
  infrastructure or a second OpenSpec evidence ledger. Ordinary exploration
  needs no new tag/admission machinery; released source gates remain intact.
  Exact training-state resume is not a current promise.

rules:
  specs:
    - Encode observable compatibility-sensitive behavior, not experimental hypotheses or verdicts; do not invent spec deltas for an internal refactor.
    - Preserve the owning image, geometry, token, packing, objective, metric and artifact semantics.
  design:
    - Identify the scientific owner separately from reusable source/consumer contracts; compare consequential alternatives without prescribing a fixed agent topology.
  tasks:
    - Use dependency-ordered verifiable slices and include removal of replaced paths; detail only the active work.
    - Use the user contract's proportional validation and bounded review rather than automatic standards/intent audit rounds for every wave.
