schema: spec-driven

context: |
  Main owns stable source integration and annotation/data operations.
  docs/BRANCH_AND_WORKTREE_POLICY.md owns checkout boundaries;
  docs/OUTPUT_STORAGE_POLICY.md owns shared assets and run destinations.
  Read /data/CoordExp/.codex/AGENTS.md if not already loaded for user authority,
  research/engineering discipline and review policy. docs/AGENT_INDEX.md owns
  local environment integration and the CoordExp design-priority order.
  Current behavior belongs to this checkout's source, typed configs and tests;
  openspec/specs/ owns stable compatibility. Research evidence and meaning
  remain with canonical research-probes. Exact training-state resume is not
  a current promise. Do not replace these owners with historical plans.

rules:
  specs:
    - Encode observable stable behavior only; internal refactors without behavior changes should not invent normative deltas.
    - Preserve the owning data, geometry, token, packing, loss, metric, cache and artifact contracts end to end.
  design:
    - Name each changed owner and real caller/consumer; compare consequential alternatives without mandating a fixed agent topology.
  tasks:
    - Use dependency-ordered, independently verifiable slices and include retirement of replaced paths.
    - Follow the user contract's proportional validation and bounded review; do not add automatic parallel audit verdicts for every wave.
